<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="aco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="0.45" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cabeca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cabo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.95"/><stop offset="0.4" stop-color="#f97316" stop-opacity="0.45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- brilho no ponto de impacto -->
  <circle cx="51" cy="55" r="17" fill="url(#brilho)"/>
  <!-- bigorna -->
  <path d="M22 56 H80 V63 H71 Q66 64 64 69 V74 L72 78 V83 H36 V78 L44 74 V69 Q42 64 37 63 H32 Q25 62 22 56 Z" fill="url(#aco)"/>
  <rect x="22" y="55" width="58" height="3" rx="1.5" fill="#f1f5f9"/>
  <rect x="36" y="81" width="36" height="3" rx="1" fill="#1e293b"/>
  <!-- martelo batendo: cabeça no centro da bigorna, cabo subindo pra direita -->
  <g transform="rotate(38 52 47)">
    <rect x="49.5" y="15" width="5.5" height="29" rx="2.5" fill="url(#cabo)"/>
    <rect x="40" y="41" width="24" height="12" rx="2.5" fill="url(#cabeca)"/>
    <rect x="40" y="41" width="24" height="3.5" rx="1.5" fill="#f8fafc"/>
  </g>
  <!-- faíscas saindo do impacto -->
  <g stroke="#fdba74" stroke-width="2.2" stroke-linecap="round">
    <line x1="37" y1="51" x2="31" y2="47"/>
    <line x1="40" y1="47" x2="37" y2="41"/>
    <line x1="33" y1="55" x2="26.5" y2="54"/>
    <line x1="66" y1="51" x2="72" y2="48"/>
  </g>
  <g fill="#fde68a">
    <circle cx="28" cy="44" r="1.4"/><circle cx="35" cy="37.5" r="1.2"/><circle cx="23.5" cy="50.5" r="1.1"/><circle cx="75" cy="45" r="1.2"/>
  </g>
</svg>
